<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon-512.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#0e1636" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>CareerForge</title>
    <style>
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
        background: radial-gradient(circle at 50% 40%, #1b2a66 0%, #0e1636 60%, #080d22 100%);
        color: #e6f0ff;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        transition: opacity 0.5s ease, visibility 0.5s ease;
      }
      #boot-splash.hide {
        opacity: 0;
        visibility: hidden;
      }
      #boot-splash .emblem-wrap {
        position: relative;
        width: 132px;
        height: 132px;
        animation: cf-pop 0.9s cubic-bezier(0.2, 0.9, 0.3, 1.3) both;
      }
      #boot-splash .emblem-wrap::before {
        content: '';
        position: absolute;
        inset: -18px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(70, 120, 255, 0.45), transparent 70%);
        animation: cf-glow 1.8s ease-in-out infinite;
      }
      #boot-splash img {
        position: relative;
        width: 100%;
        height: 100%;
        animation: cf-float 2.4s ease-in-out 0.9s infinite;
      }
      #boot-splash .name {
        font-size: 30px;
        font-weight: 700;
        letter-spacing: 0.06em;
        background: linear-gradient(90deg, #9fd3f5, #ffffff, #4f7dff, #9fd3f5);
        background-size: 300% 100%;
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        animation:
          cf-rise 0.8s ease 0.35s both,
          cf-shine 2.5s linear 1s infinite;
      }
      #boot-splash .bar {
        width: 160px;
        height: 4px;
        border-radius: 4px;
        background: rgba(255, 255, 255, 0.12);
        overflow: hidden;
        animation: cf-rise 0.6s ease 0.6s both;
      }
      #boot-splash .bar span {
        display: block;
        height: 100%;
        width: 40%;
        border-radius: 4px;
        background: linear-gradient(90deg, #4f7dff, #9fd3f5);
        animation: cf-load 1.1s ease-in-out infinite;
      }
      @keyframes cf-pop {
        from { transform: scale(0.4) rotate(-8deg); opacity: 0; }
        to { transform: scale(1) rotate(0); opacity: 1; }
      }
      @keyframes cf-float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-6px); }
      }
      @keyframes cf-glow {
        0%, 100% { opacity: 0.55; transform: scale(0.95); }
        50% { opacity: 1; transform: scale(1.08); }
      }
      @keyframes cf-rise {
        from { transform: translateY(14px); opacity: 0; }
        to { transform: translateY(0); opacity: 1; }
      }
      @keyframes cf-shine {
        to { background-position: 300% 0; }
      }
      @keyframes cf-load {
        0% { transform: translateX(-110%); }
        100% { transform: translateX(260%); }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot-splash * { animation-duration: 0.01s !important; animation-iteration-count: 1 !important; }
      }
    </style>
    <script type="module" crossorigin src="/assets/index-CGCyH2xp.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-Dg6E863j.css">
  </head>
  <body>
    <div id="boot-splash" role="status" aria-label="Loading CareerForge">
      <div class="emblem-wrap"><img src="/emblem.png" alt="" /></div>
      <div class="name">CareerForge</div>
      <div class="bar"><span></span></div>
    </div>
    <script>
      // Boot splash stays up for at least 2 s, and until the app has mounted.
      window.__cfBootStart = Date.now();
      window.__cfHideSplash = function () {
        var el = document.getElementById('boot-splash');
        if (!el || el.dataset.hiding) return;
        el.dataset.hiding = '1';
        var wait = Math.max(0, 2000 - (Date.now() - window.__cfBootStart));
        setTimeout(function () {
          el.classList.add('hide');
          setTimeout(function () { el.remove(); }, 600);
        }, wait);
      };
    </script>
    <div id="root"></div>
  </body>
</html>
