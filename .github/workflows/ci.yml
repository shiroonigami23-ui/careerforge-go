name: CI

on:
  push:
    branches: [main, "wip/**", "feat/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go:
    name: Go (fmt, vet, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "Run gofmt -w on:"; echo "$unformatted"; exit 1; fi
      - name: go vet
        run: go vet ./...
      - name: go test (race detector)
        run: go test -race ./...
      - name: go build (linux, windows, macOS)
        run: |
          CGO_ENABLED=0 go build -o /tmp/cf-linux ./cmd/careerforge
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -o /tmp/cf.exe ./cmd/careerforge
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -o /tmp/cf-mac ./cmd/careerforge
      - name: Server smoke test
        run: |
          mkdir -p /tmp/cfroot
          HOST=127.0.0.1 PORT=18080 CAREERFORGE_ROOT=/tmp/cfroot /tmp/cf-linux &
          for i in $(seq 1 40); do curl -fsS http://127.0.0.1:18080/ >/dev/null && break; sleep 0.25; done
          curl -fsS http://127.0.0.1:18080/ | grep -q '<div id="root">'
          # the SQLite DB must not be downloadable through /files/
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/files/data/careerforge.db)
          test "$code" != "200"
          code=$(curl -s --path-as-is -o /dev/null -w "%{http_code}" "http://127.0.0.1:18080/files/uploaded_files/../data/careerforge.db")
          test "$code" != "200"

  tests:
    name: All test suites (Go + engine + browser E2E), recorded
    runs-on: ubuntu-24.04 # Playwright has no Chromium build for the ubuntu-26.04 image yet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci && npx playwright install --with-deps chromium && npm run build
      - name: Run and record
        run: node tests/run-all.mjs
      - name: Test report
        if: always()
        run: |
          cat tests/results/LATEST.md >> "$GITHUB_STEP_SUMMARY"
          cat tests/results/LATEST.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: tests/results/

  e2e-server:
    name: Browser tests against the Go server
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build UI into the server and start it
        run: |
          (cd frontend && npm ci && npx playwright install --with-deps chromium && npm run build)
          go build -o /tmp/careerforge ./cmd/careerforge
          mkdir -p /tmp/cfroot
          HOST=127.0.0.1 PORT=8080 CAREERFORGE_ROOT=/tmp/cfroot /tmp/careerforge > /tmp/server.log 2>&1 &
          for i in $(seq 1 40); do curl -fsS http://127.0.0.1:8080/ >/dev/null && break; sleep 0.25; done
          curl -fsS http://127.0.0.1:8080/dashboard/__probe__ -o /dev/null -w '%{http_code}\n' || true
      - name: Playwright (server mode)
        working-directory: frontend
        env:
          E2E_BASE_URL: http://127.0.0.1:8080
        run: npx playwright test
      - name: Server log
        if: failure()
        run: cat /tmp/server.log
