name: CI

on:
  push:
    branches: [main, "wip/**", "feat/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go:
    name: Go (fmt, vet, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "Run gofmt -w on:"; echo "$unformatted"; exit 1; fi
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test -race ./...
      - name: go build (linux, windows, macOS)
        run: |
          CGO_ENABLED=0 go build -o /tmp/cf-linux ./cmd/careerforge
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -o /tmp/cf.exe ./cmd/careerforge
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -o /tmp/cf-mac ./cmd/careerforge
      - name: Server smoke test
        run: |
          mkdir -p /tmp/cfroot
          HOST=127.0.0.1 PORT=18080 CAREERFORGE_ROOT=/tmp/cfroot /tmp/cf-linux &
          for i in $(seq 1 40); do curl -fsS http://127.0.0.1:18080/ >/dev/null && break; sleep 0.25; done
          curl -fsS http://127.0.0.1:18080/ | grep -q '<div id="root">'
          # the SQLite DB must not be downloadable through /files/
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/files/data/careerforge.db)
          test "$code" != "200"
          code=$(curl -s --path-as-is -o /dev/null -w "%{http_code}" "http://127.0.0.1:18080/files/uploaded_files/../data/careerforge.db")
          test "$code" != "200"

  web:
    name: Frontend (unit tests, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci && npx vitest run && npm run build
