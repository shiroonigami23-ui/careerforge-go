<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; img-src 'self'" />
    <style>
      html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
      .card {
        position: absolute; inset: 10px; border-radius: 22px;
        background: radial-gradient(circle at 50% 35%, #1b2a66 0%, #0e1636 65%, #080d22 100%);
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.45);
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
        font-family: 'Segoe UI', system-ui, sans-serif; animation: fade 0.4s ease both;
      }
      .wrap { position: relative; width: 112px; height: 112px; animation: pop 0.9s cubic-bezier(0.2, 0.9, 0.3, 1.3) both; }
      .wrap::before {
        content: ''; position: absolute; inset: -16px; border-radius: 50%;
        background: radial-gradient(circle, rgba(70, 120, 255, 0.45), transparent 70%);
        animation: glow 1.8s ease-in-out infinite;
      }
      img { position: relative; width: 100%; height: 100%; animation: float 2.4s ease-in-out 0.9s infinite; }
      .name {
        font-size: 28px; font-weight: 700; letter-spacing: 0.06em;
        background: linear-gradient(90deg, #9fd3f5, #ffffff, #4f7dff, #9fd3f5); background-size: 300% 100%;
        -webkit-background-clip: text; color: transparent;
        animation: rise 0.8s ease 0.35s both, shine 2.5s linear 1s infinite;
      }
      .bar { width: 150px; height: 4px; border-radius: 4px; background: rgba(255, 255, 255, 0.12); overflow: hidden; animation: rise 0.6s ease 0.6s both; }
      .bar span { display: block; height: 100%; width: 40%; border-radius: 4px; background: linear-gradient(90deg, #4f7dff, #9fd3f5); animation: load 1.1s ease-in-out infinite; }
      .hint { color: #8fa3cf; font-size: 12px; animation: rise 0.6s ease 0.8s both; }
      @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
      @keyframes pop { from { transform: scale(0.4) rotate(-8deg); opacity: 0; } to { transform: none; opacity: 1; } }
      @keyframes float { 50% { transform: translateY(-6px); } }
      @keyframes glow { 0%, 100% { opacity: 0.55; transform: scale(0.95); } 50% { opacity: 1; transform: scale(1.08); } }
      @keyframes rise { from { transform: translateY(14px); opacity: 0; } to { transform: none; opacity: 1; } }
      @keyframes shine { to { background-position: 300% 0; } }
      @keyframes load { from { transform: translateX(-110%); } to { transform: translateX(260%); } }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="wrap"><img src="emblem.png" alt="" /></div>
      <div class="name">CareerForge</div>
      <div class="bar"><span></span></div>
      <div class="hint">Starting local engine…</div>
    </div>
  </body>
</html>
